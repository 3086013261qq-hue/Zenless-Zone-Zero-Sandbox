name: Assemble Zenless CCV3 v1.1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_fullcard_v1_1.py'
      - '.github/workflows/assemble_ccv3_v1_1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build fullstack V3 card and standalone lorebook
        run: python scripts/build_fullcard_v1_1.py
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenless-ccv3-fullstack-v1.1.0
          path: |
            assembly/card/dist/*v1.1.0.json
            assembly/worldbook/dist/*v1.1.0.json
            assembly/qa/*v1.1.0.json
            assembly/qa/*v1.1.0.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified build files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assembly/card/dist/*v1.1.0.json assembly/worldbook/dist/*v1.1.0.json assembly/qa/*v1.1.0.json assembly/qa/*v1.1.0.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish corrected fullstack CCV3 v1.1.0 [skip ci]"
            git push origin HEAD:main
          fi
