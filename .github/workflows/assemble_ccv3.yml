name: Assemble Zenless CCV3
on:
  push:
    branches: [main]
    paths:
      - 'assembly/**'
      - 'scripts/build_fullcard.py'
      - '.github/workflows/assemble_ccv3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build full CCV3 and worldbook
        run: python scripts/build_fullcard.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenless-ccv3-fullstack-v1.0.0
          path: |
            assembly/card/dist/*.json
            assembly/worldbook/dist/*.json
            assembly/qa/*.json
            assembly/qa/*.md
          if-no-files-found: error
          retention-days: 90
